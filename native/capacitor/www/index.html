    <title>Claw Monitor</title>
  </head>
  <body style="margin:0;background:#1a1410;color:#f5f1ec;font-family:system-ui">
    <main style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;padding:24px;text-align:center">
      <h1 style="font-size:18px;font-weight:600;margin:0 0 8px">Claw Monitor</h1>
